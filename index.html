<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tripleS Cosmo Live-Clip 成員次數與時間統計</title>
    <meta name="description" content="tripleS Cosmo Room Live Clip 各成員參與次數與直播時間統計">
    
    <!-- Google Fonts & Supabase JS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #0d0f1d;
            --bg-card: rgba(22, 27, 46, 0.75);
            --bg-card-hover: rgba(33, 40, 68, 0.9);
            --border-glass: rgba(255, 255, 255, 0.08);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --accent-purple: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', 'Noto Sans TC', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(139, 92, 246, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(6, 182, 212, 0.1) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        /* 頂部 Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            background: rgba(13, 15, 29, 0.85);
            border-bottom: 1px solid var(--border-glass);
            padding: 16px 28px;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-logo {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: linear-gradient(135deg, #8b5cf6, #ec4899);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: white;
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.3);
        }

        .brand-title h1 {
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, #ffffff, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-summary {
            display: flex;
            gap: 16px;
        }

        .stat-pill {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.88rem;
            color: var(--text-muted);
        }

        .stat-pill strong {
            color: white;
            font-size: 1rem;
        }

        /* 主區域 */
        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .main-layout {
            display: grid;
            grid-template-columns: 360px 1fr;
            gap: 28px;
        }

        @media (max-width: 900px) {
            .main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* 側邊欄：成員排行榜 */
        .sidebar-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 20px;
            backdrop-filter: blur(16px);
        }

        .sidebar-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-title i {
            color: #f59e0b;
        }

        .member-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: calc(100vh - 200px);
            overflow-y: auto;
            padding-right: 4px;
        }

        .member-item {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-glass);
            padding: 10px 14px;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .member-item:hover, .member-item.active {
            background: rgba(139, 92, 246, 0.2);
            border-color: var(--accent-purple);
            transform: translateX(4px);
        }

        .rank-num {
            font-size: 0.9rem;
            font-weight: 800;
            width: 24px;
            color: var(--text-muted);
            text-align: center;
        }

        .rank-1 { color: #f59e0b; }
        .rank-2 { color: #9ca3af; }
        .rank-3 { color: #b45309; }

        .member-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid transparent;
        }

        .member-info {
            flex: 1;
        }

        .member-name-text {
            font-weight: 700;
            font-size: 0.95rem;
        }

        .clip-count-badge {
            font-size: 1.1rem;
            font-weight: 800;
            color: #c084fc;
        }

        .clip-unit {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        /* 右側：Live Clip 時間與影片紀錄牆 */
        .content-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: blur(16px);
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .filter-title {
            font-size: 1.15rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* 影片列表 */
        .clips-timeline {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .clip-row {
            display: flex;
            gap: 16px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 16px;
            padding: 16px;
            transition: all 0.2s;
            cursor: pointer;
            align-items: center;
        }

        .clip-row:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--accent-purple);
        }

        .video-thumb {
            width: 140px;
            height: 90px;
            border-radius: 12px;
            background: #000;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .video-thumb video, .video-thumb img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay-mini {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
        }

        .clip-details {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .clip-date {
            font-size: 0.85rem;
            color: #c084fc;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .clip-participating-members {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .member-tag {
            font-size: 0.75rem;
            padding: 2px 8px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .member-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .clip-text-content {
            font-size: 0.9rem;
            color: #d1d5db;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* 影片播放彈窗 */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(5, 7, 15, 0.85);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            padding: 20px;
        }

        .modal.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: #121629;
            border: 1px solid var(--border-glass);
            border-radius: 24px;
            width: 100%;
            max-width: 750px;
            overflow: hidden;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: white;
            font-size: 16px;
            cursor: pointer;
            z-index: 10;
        }

        .modal-video-box video {
            width: 100%;
            max-height: 450px;
            background: black;
            outline: none;
        }

        .modal-body {
            padding: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

    <!-- 頂部 Header -->
    <header>
        <div class="header-container">
            <div class="brand">
                <div class="brand-logo"><i class="fa-solid fa-video"></i></div>
                <div class="brand-title">
                    <h1>tripleS Live-Clip 成員統計</h1>
                </div>
            </div>

            <div class="header-summary">
                <div class="stat-pill">正片 Live-Clip 總數: <strong id="total-live-clips">0</strong> 次</div>
                <div class="stat-pill">統計成員數: <strong id="total-members-count">0</strong> 位</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="main-layout">
            
            <!-- 側邊欄：成員次數排行榜 -->
            <div class="sidebar-card">
                <div class="sidebar-title">
                    <i class="fa-solid fa-trophy"></i> 成員 Live-Clip 參與次數榜
                </div>

                <div class="member-list" id="member-list-container">
                    <!-- 動態注入成員列表 -->
                </div>
            </div>

            <!-- 右側內容：Live Clip 時間與影片紀錄 -->
            <div class="content-card">
                <div class="content-header">
                    <div class="filter-title" id="current-filter-title">
                        <i class="fa-solid fa-clock-rotate-left"></i> 所有 Live-Clip 時間紀錄
                    </div>
                </div>

                <div class="clips-timeline" id="clips-timeline-container">
                    <!-- 動態注入影片列表 -->
                </div>
            </div>

        </div>
    </div>

    <!-- 影片播放器彈窗 Modal -->
    <div class="modal" id="video-modal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-video-box" id="modal-video-box"></div>
            <div class="modal-body">
                <div id="modal-date-text" style="color:#c084fc; font-weight:600; font-size:0.85rem; margin-bottom:8px;"></div>
                <div id="modal-tags" style="display:flex; gap:6px; margin-bottom:12px;"></div>
                <p id="modal-content-text" style="line-height:1.5; font-size:0.95rem; color:#e5e7eb;"></p>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://ojjxrqkexcumpapnecjz.supabase.co";
        const SUPABASE_KEY = "sb_publishable_lA-gW3rOIF7X4hNiUGSCCQ_U_-0wOrv";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let liveClips = [];
        let selectedMember = null;
        let memberStats = [];

        async function init() {
            try {
                // 讀取 room_posts 中 kind == 'live-clip' 的資料，並排除 access_type == 'all' (幕後花絮)
                const { data, error } = await supabaseClient
                    .from('room_posts')
                    .select('*')
                    .eq('kind', 'live-clip')
                    .neq('access_type', 'all')
                    .order('created_at', { ascending: false });

                if (error) throw error;
                liveClips = data || [];

                calculateMemberStats();
                renderSidebar();
                renderTimeline();
            } catch (err) {
                console.error("載入失敗:", err);
                document.getElementById('clips-timeline-container').innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-circle-exclamation" style="font-size:36px;margin-bottom:12px;"></i>
                        <p>載入失敗: ${err.message}</p>
                    </div>
                `;
            }
        }

        // 計算參與成員統計 (解析 videoItem.channels 陣列)
        function calculateMemberStats() {
            const counts = {};
            const meta = {};

            liveClips.forEach(post => {
                const channels = post.channels || [];
                if (channels.length === 0) {
                    // 若無 channels 則回退使用 author_name
                    const name = post.author_name || 'Artist';
                    counts[name] = (counts[name] || 0) + 1;
                    if (!meta[name]) {
                        meta[name] = { avatar: post.author_avatar, color: '#8b5cf6' };
                    }
                } else {
                    channels.forEach(ch => {
                        const name = ch.name || post.author_name;
                        if (name) {
                            counts[name] = (counts[name] || 0) + 1;
                            if (!meta[name]) {
                                meta[name] = {
                                    avatar: ch.profileImageUrl || post.author_avatar,
                                    color: ch.primaryColorHex || '#8b5cf6'
                                };
                            }
                        }
                    });
                }
            });

            memberStats = Object.entries(counts)
                .map(([name, count]) => ({
                    name,
                    count,
                    avatar: meta[name] ? meta[name].avatar : '',
                    color: meta[name] ? meta[name].color : '#8b5cf6'
                }))
                .sort((a, b) => b.count - a.count);

            document.getElementById('total-live-clips').innerText = liveClips.length;
            document.getElementById('total-members-count').innerText = memberStats.length;
        }

        // 渲染側邊欄成員排行榜
        function renderSidebar() {
            const container = document.getElementById('member-list-container');
            
            let html = `
                <div class="member-item ${selectedMember === null ? 'active' : ''}" onclick="selectMember(null)">
                    <div class="rank-num"><i class="fa-solid fa-users"></i></div>
                    <div class="member-name-text">全體成員 (所有直播)</div>
                    <div class="clip-count-badge">${liveClips.length} <span class="clip-unit">次</span></div>
                </div>
            `;

            html += memberStats.map((m, idx) => `
                <div class="member-item ${selectedMember === m.name ? 'active' : ''}" onclick="selectMember('${m.name}')">
                    <div class="rank-num ${idx < 3 ? 'rank-' + (idx + 1) : ''}">${idx + 1}</div>
                    <img class="member-avatar" src="${m.avatar}" style="border-color:${m.color}" alt="${m.name}" onerror="this.src='https://via.placeholder.com/42'">
                    <div class="member-info">
                        <div class="member-name-text">${m.name}</div>
                    </div>
                    <div class="clip-count-badge" style="color:${m.color}">${m.count} <span class="clip-unit">次</span></div>
                </div>
            `).join('');

            container.innerHTML = html;
        }

        // 點擊選擇成員
        function selectMember(name) {
            selectedMember = name;
            renderSidebar();
            renderTimeline();
        }

        // 渲染右側 Live-Clip 時間列表
        function renderTimeline() {
            const container = document.getElementById('clips-timeline-container');
            const titleEl = document.getElementById('current-filter-title');

            if (selectedMember) {
                titleEl.innerHTML = `<i class="fa-solid fa-user-check"></i> ${selectedMember} 參與的 Live-Clip 時間紀錄`;
            } else {
                titleEl.innerHTML = `<i class="fa-solid fa-clock-rotate-left"></i> 所有 Live-Clip 時間紀錄`;
            }

            // 篩選包含選定成員的 Live-Clips
            const filteredClips = liveClips.filter(post => {
                if (!selectedMember) return true;
                const channels = post.channels || [];
                if (channels.length > 0) {
                    return channels.some(ch => ch.name === selectedMember);
                }
                return post.author_name === selectedMember;
            });

            if (filteredClips.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-video-slash" style="font-size:36px;margin-bottom:12px;"></i>
                        <p>尚無此成員的 Live-Clip 紀錄</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredClips.map(post => {
                const videoMedia = (post.media || []).find(m => m.kind === 'video') || (post.media || [])[0];
                const videoUrl = videoMedia ? videoMedia.url : '';
                const dateStr = post.created_at ? new Date(post.created_at).toLocaleString('zh-TW', {
                    year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short'
                }) : '';

                const channels = post.channels || [];

                return `
                    <div class="clip-row" onclick="openModal(${post.id})">
                        <div class="video-thumb">
                            ${videoUrl ? `<video src="${videoUrl}#t=0.5" preload="metadata"></video><div class="play-overlay-mini"><i class="fa-solid fa-play"></i></div>` : ''}
                        </div>
                        <div class="clip-details">
                            <div class="clip-date"><i class="fa-regular fa-calendar"></i> ${dateStr}</div>
                            <div class="clip-text-content">${post.content || 'Live 直播紀錄'}</div>
                            <div class="clip-participating-members">
                                ${channels.map(ch => `
                                    <span class="member-tag">
                                        <span class="member-dot" style="background:${ch.primaryColorHex || '#8b5cf6'}"></span>
                                        ${ch.name}
                                    </span>
                                `).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 開啟 Modal
        function openModal(postId) {
            const post = liveClips.find(p => p.id === postId);
            if (!post) return;

            const modal = document.getElementById('video-modal');
            const videoBox = document.getElementById('modal-video-box');
            const videoMedia = (post.media || []).find(m => m.kind === 'video') || (post.media || [])[0];
            const videoUrl = videoMedia ? videoMedia.url : '';

            videoBox.innerHTML = videoUrl ? `<video src="${videoUrl}" controls autoplay></video>` : '';

            document.getElementById('modal-date-text').innerText = new Date(post.created_at).toLocaleString('zh-TW');
            document.getElementById('modal-content-text').innerText = post.content || '';

            const channels = post.channels || [];
            document.getElementById('modal-tags').innerHTML = channels.map(ch => `
                <span class="member-tag">
                    <span class="member-dot" style="background:${ch.primaryColorHex || '#8b5cf6'}"></span>
                    ${ch.name}
                </span>
            `).join('');

            modal.classList.add('open');
        }

        function closeModal() {
            document.getElementById('video-modal').classList.remove('open');
            document.getElementById('modal-video-box').innerHTML = '';
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
